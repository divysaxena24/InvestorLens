[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Your Name", email = "divysaxena2402@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.4.0",
    "fastapi>=0.163.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf4llm>=2.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "qdrant-client>=1.20.0",
    "rapidocr-onnxruntime>=1.4.4",
    "sentence-transformers>=6.3.0",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

